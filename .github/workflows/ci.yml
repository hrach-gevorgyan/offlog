name: CI

# Runs the same three checks the release checklist in CLAUDE.md requires
# before every commit -- type-check, build, and the vitest suite -- so a
# broken build shows up as a red X on GitHub instead of only being caught
# by hand later. Scoped to offlog-app/ only; offlog-desktop (Tauri/Rust)
# has its own separate build story and isn't covered here yet.
on:
  push:
    branches: [main]
    paths: ['offlog-app/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['offlog-app/**', '.github/workflows/ci.yml']

# Least-privilege default -- this workflow only checks out code and runs
# build/test/tsc, it never needs to write anything back to the repo.
# A newer push supersedes an in-flight run for the same ref. Without this a
# burst of pushes leaves several full builds racing, and CodeQL's parallel
# SARIF uploads for one ref collide.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offlog-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: offlog-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run check`, NOT `tsc --noEmit -p .`. The root tsconfig.json is
      # `"files": []` plus project references, and plain `tsc -p .` does not
      # traverse references -- so the old command type-checked exactly zero
      # source files and passed unconditionally. It hid 12 real errors
      # (found 2026-07-31). This runs svelte-check over tsconfig.app.json,
      # which is the only thing that checks .svelte files at all, plus tsc
      # over the node config.
      - name: Type-check (svelte-check + tsc)
        run: npm run check

      - name: Build (must be warning-free)
        run: npm run build

      - name: Unit tests
        run: npx vitest run
