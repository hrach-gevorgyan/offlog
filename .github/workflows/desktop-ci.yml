name: Desktop CI

# Three jobs in one (runs when the Tauri/Rust side changes, or the code
# that encrypts sync, or a dependency bump that could change PouchDB):
#  1. A real compile check for the Tauri/Rust side. Without it a
#     Dependabot bump can reach a mergeable state with a broken build --
#     rand 0.10's Rng->RngExt trait split did exactly that.
#  2. Cache warming for release.yml -- GitHub Actions caches created on
#     a tag ref are NOT shareable with other tags; only default-branch
#     caches are. So the release workflow's Windows job can only reuse
#     cargo/vendor caches if something on main creates them -- this job
#     is that something. Same reason release.yml deliberately has no
#     Gradle cache: nothing builds Android on main to warm one, and a
#     cache written by tag vX is invisible to tag vY.

# Only what this workflow actually compiles or runs. fetch-nyxdb-win.ps1
# belongs here because the build invokes it; the other scripts,
# mdns-browse/ and vendor/ are dev-only and never reach the build, so a
# change there must not spend a full release cargo build. The list is
# repeated rather than shared via a YAML anchor -- GitHub Actions does
# not resolve anchors.
#
# On push, tauri.conf.json alone doesn't count: a release commit changes only
# its version, and release.yml builds the same code minutes later. Any other
# src-tauri change still runs this, and still compiles the config with it.
on:
  push:
    branches: [main]
    paths: ['offlog-desktop/src-tauri/**', '!offlog-desktop/src-tauri/tauri.conf.json', 'offlog-desktop/scripts/fetch-nyxdb-win.ps1', 'offlog-desktop/scripts/phase0-repro/**', 'offlog-app/src/lib/syncCrypto.ts', 'offlog-app/src/lib/db/encryptedFetch.ts', 'offlog-app/src/lib/db/sync.ts', 'offlog-app/tests/encryptedSync.e2e.test.ts', 'offlog-app/package-lock.json', '.github/workflows/desktop-ci.yml']
  pull_request:
    branches: [main]
    paths: ['offlog-desktop/src-tauri/**', 'offlog-desktop/scripts/fetch-nyxdb-win.ps1', 'offlog-desktop/scripts/phase0-repro/**', 'offlog-app/src/lib/syncCrypto.ts', 'offlog-app/src/lib/db/encryptedFetch.ts', 'offlog-app/src/lib/db/sync.ts', 'offlog-app/tests/encryptedSync.e2e.test.ts', 'offlog-app/package-lock.json', '.github/workflows/desktop-ci.yml']

# Least-privilege default -- this workflow only checks out code, runs
# tests against the vendored NyxDB and a cargo build; it never needs to
# write anything back to the repo.
# A newer push supersedes an in-flight run for the same ref. Without this a
# burst of pushes leaves several full builds racing, and CodeQL's parallel
# SARIF uploads for one ref collide.
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: offlog-app/package-lock.json

      # tauri-build resolves frontendDist at compile time, so the web
      # assets must exist even for a plain cargo build.
      - name: Build web assets
        working-directory: offlog-app
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            offlog-desktop/src-tauri/target
          key: cargo-windows-${{ hashFiles('offlog-desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Cache vendored NyxDB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: offlog-desktop/vendor/nyxdb-win
          # Bump this key's version segment together with the fetch
          # script's $Ref -- a stale cache would otherwise pin an old
          # NyxDB forever (the script skips fetching when the directory
          # already exists).
          key: nyxdb-win-v0.1.8

      - name: Fetch vendored NyxDB (no-op on cache hit)
        working-directory: offlog-desktop
        shell: pwsh
        run: ./scripts/fetch-nyxdb-win.ps1

      # Edits after the first sync, over HTTP against the vendored binary:
      # a server that drops _revisions turns every edit into a phantom
      # conflict, which in-memory replication tests can't see.
      - name: NyxDB edit replication (HTTP)
        working-directory: offlog-desktop
        run: node scripts/phase0-repro/edit-replication.js

      # Encrypted sync against the same binary: two devices stay in step, the
      # server's raw copy holds nothing readable, forged docs are refused.
      - name: Encrypted sync end to end (HTTP)
        working-directory: offlog-app
        env:
          NYXDB_BIN: ${{ github.workspace }}/offlog-desktop/vendor/nyxdb-win/nyxdb.exe
        run: npx vitest run tests/encryptedSync.e2e.test.ts

      - name: Cargo build (release profile, matches release.yml)
        working-directory: offlog-desktop/src-tauri
        run: cargo build --release
