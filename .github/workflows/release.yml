name: Release

# Builds the Android APK and the Windows Tauri installer automatically
# whenever a version tag (vX.Y.Z) is pushed, and attaches both to a DRAFT
# GitHub Release -- never auto-published. You still review and click
# "Publish release" yourself; this only removes the manual local build
# step that used to eat a lot of time (and Gradle/cargo build turns)
# every release.
#
# Android signing: build.gradle uses the real playstore signing config
# whenever offlog-app/android/app/keystore.properties is present (see
# keystore.properties.example for the format), falling back to AGP's
# public debug keystore otherwise. This workflow writes that file (and
# the keystore itself) from repo secrets before building -- if those
# secrets aren't set, the build silently falls back to the debug keystore
# instead of failing, so this workflow still works before you've added
# them. Add these under Settings -> Secrets and variables -> Actions:
#   ANDROID_KEYSTORE_BASE64   -- `base64 -w0 offlog-release.keystore`
#   ANDROID_KEYSTORE_PASSWORD -- same value used for both store and key
#                                 password (see keystore.properties.example)
#
# Desktop auto-updater signing (E3): tauri.conf.json's plugins.updater
# has a real pubkey (generated with `cargo tauri signer generate`) and a
# real endpoint (GitHub Releases' "latest" download
# URL). tauri-action signs the installer + writes latest.json whenever
# these two env vars are set on the Windows job -- if unset, the build
# still succeeds, it just produces an unsigned update artifact nobody
# can verify (harmless until the owner adds the secrets). Add:
#   TAURI_SIGNING_PRIVATE_KEY          -- contents of the private key
#                                          file from `cargo tauri signer
#                                          generate` (~/.tauri/offlog-updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD -- the password set at keygen time
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write  # needed to create the draft release + upload assets

jobs:
  # Nothing here is built or published until the tagged commit passes the
  # same gate CI runs on main. ci.yml only fires on pushes to main, so
  # without this a tag could be cut from a commit CI never ran -- or ran
  # against different content -- and release.yml would happily publish it.
  # It builds nothing itself; the build jobs below need it first.
  verify:
    # Narrower than the workflow default: this job only reads the repo and
    # runs the gate. Nothing here creates a release or uploads an asset.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offlog-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: offlog-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The three version sources must agree and both docs must carry an
      # entry. The build jobs re-check this against the tag itself; this is
      # the cheaper self-consistency half, run before anything else.
      - name: Version consistency
        run: npm run version:check

      - name: Type-check (svelte-check + tsc)
        run: npm run check

      # Judged by exit code, not the summary line: vitest prints "N passed"
      # and still exits non-zero on an unhandled rejection.
      - name: Tests
        run: npx vitest run

  build-android:
    needs: verify
    # Narrower than the workflow default, same reasoning as verify's: this
    # job only builds the APK and hands it to upload-artifact (its own
    # token, unrelated to contents: write) -- it never creates or updates
    # a release itself, unlike build-desktop-windows and draft-release
    # below, which genuinely need write to call the GitHub Release API.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: offlog-app/package-lock.json

      - name: Install web dependencies
        working-directory: offlog-app
        run: npm ci

      # Refuses to publish a release whose tag disagrees with the version
      # in package.json / build.gradle / tauri.conf.json, or that has no
      # changelog and release-notes entry. Runs before anything is built,
      # so a wrong tag costs nothing and publishes nothing.
      - name: Verify the tag matches the version
        working-directory: offlog-app
        run: node scripts/version.js check --tag "$GITHUB_REF_NAME"

      - name: Build web assets
        working-directory: offlog-app
        run: npm run build

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: 'temurin'
          java-version: '21'
          # Restores the Gradle cache codeql-android.yml writes on main --
          # same reasoning as the cargo restore in the desktop job below:
          # a tag run can only reuse default-branch caches. On an exact key
          # hit the post-job save is skipped, so this costs nothing to a
          # tag ref; a miss just builds cold as before.
          cache: 'gradle'
          # Key the cache on what actually decides the dependency graph.
          # The default glob hashes every *.gradle* file, which includes
          # app/build.gradle -- and that carries versionName/versionCode, so
          # every release threw away the whole ~590MB cache for a number
          # Gradle never resolves against. app/build.gradle only references
          # versions via $vars from variables.gradle.
          cache-dependency-path: |
            offlog-app/android/variables.gradle
            offlog-app/android/build.gradle
            offlog-app/android/capacitor.settings.gradle
            offlog-app/android/app/capacitor.build.gradle
            offlog-app/android/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4

      - name: Sync Capacitor Android project
        working-directory: offlog-app
        run: npx cap sync android

      - name: Write real signing key (if configured)
        working-directory: offlog-app/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        # No-ops (leaves build.gradle to fall back to the debug keystore)
        # if the secrets haven't been added yet -- lets this workflow work
        # before and after the real key is wired in, without two separate
        # workflow files to maintain.
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > offlog-release.keystore
            echo "storeFile=offlog-release.keystore" > keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=offlog" >> keystore.properties
            echo "keyPassword=$KEYSTORE_PASSWORD" >> keystore.properties
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not set -- building with the debug keystore instead."
          fi

      - name: Build release APK
        working-directory: offlog-app/android
        # gradlew's executable bit doesn't always survive a checkout on a
        # repo that's also been worked on from Windows (git tracks the
        # mode bit, but it can get lost) -- set it explicitly rather than
        # relying on whatever's committed.
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: android-apk
          path: offlog-app/android/app/build/outputs/apk/release/app-release.apk

  build-desktop-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: offlog-app/package-lock.json

      - name: Install web dependencies
        working-directory: offlog-app
        run: npm ci

      - name: Build web assets
        working-directory: offlog-app
        run: npm run build

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable

      # Both caches are created by desktop-ci.yml on main -- tag runs
      # can only *restore* default-branch caches, never share caches
      # between tags, so there's no cache-save value here; this is
      # purely a restore for speed. Cache miss = build from scratch,
      # same as before caching existed.
      - name: Restore cargo cache (warmed by desktop-ci on main)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            offlog-desktop/src-tauri/target
          key: cargo-windows-${{ hashFiles('offlog-desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Restore vendored NyxDB cache (warmed by desktop-ci on main)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: offlog-desktop/vendor/nyxdb-win
          # Keep in sync with desktop-ci.yml's key and the fetch
          # script's $Ref.
          key: nyxdb-win-v0.1.5

      - name: Fetch vendored NyxDB (no-op on cache hit, builds from source otherwise)
        working-directory: offlog-desktop
        shell: pwsh
        run: ./scripts/fetch-nyxdb-win.ps1

      - name: Extract this version's user-facing release notes
        id: notes
        shell: bash
        run: node .github/scripts/extract-release-notes.js

      # `latest.json` (the updater's real download-URL manifest) is
      # generated by tauri-action's own release-upload step, not by
      # `cargo tauri build` itself -- it needs to know the actual
      # release/tag it's uploading to so it can embed real asset URLs.
      # Giving it tagName/releaseDraft lets it create (or reuse) the
      # draft release directly and upload the installer/.sig/latest.json
      # to it in one step, instead of routing through our own
      # upload-artifact + a separate softprops job. tagName is required:
      # without it tauri-action logs "No releaseId or tagName provided,
      # skipping all uploads" and latest.json is never made.
      - name: Build Tauri Windows installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # v1
        env:
          # Required explicitly -- the job's `permissions: contents:
          # write` grants the ambient token privileges, but tauri-action
          # still needs the actual token value passed to it to call the
          # GitHub API and create/update the release. Omitting it fails
          # with "GITHUB_TOKEN is required".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: offlog-desktop
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # offlog-app/dist was already built above; tauri.conf.json's
          # frontendDist points straight at it, so there's no separate
          # frontend build step for tauri-action to run here.

  draft-release:
    needs: [build-android, build-desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: android-apk
          path: artifacts

      # The Windows job already created the draft release (with the
      # installer/.sig/latest.json attached); this just appends the
      # APK to that same release by tag -- action-gh-release updates
      # an existing release matching tag_name rather than duplicating it.
      - name: Attach Android APK to the draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: artifacts/*.apk
