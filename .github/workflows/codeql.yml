name: CodeQL

# Advanced setup, replacing GitHub's auto-managed Default setup, whose
# Java/Kotlin (Android) scan ran with build-mode "none" and couldn't
# extract a real Gradle dependency classpath -- degraded analysis quality,
# not a broken build.
#
# This workflow covers the three languages that need no build. Java/Kotlin
# lives in codeql-android.yml, which does need one and is scoped to
# Android-affecting paths so it doesn't run on every push.
#
# IMPORTANT: Advanced setup requires the repo's "Default setup" to stay
# disabled under Settings -> Code security -> Code scanning. GitHub does
# not allow both to run for the same languages.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    # Matches the cadence GitHub's Default setup used.
    - cron: '0 6 * * 1'

# A newer push supersedes an in-flight run for the same ref. Without this a
# burst of pushes leaves several full builds racing, and CodeQL's parallel
# SARIF uploads for one ref collide.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze-js-rust-actions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'rust', 'actions']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          category: '/language:${{ matrix.language }}'
