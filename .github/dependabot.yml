version: 2

# Grouped and monthly on purpose. Two reasons:
#
# 1. docs/roadmap.md's bugfix/audit track already states the real policy --
#    "Dependabot: batched roughly monthly into whichever patch is next" --
#    but this file still said weekly. Config now matches the documented
#    intent instead of quietly contradicting it.
#
# 2. The project is in maintenance mode with one part-time maintainer.
#    Six separate PRs in one batch is exactly the
#    notification fatigue that stops a solo maintainer from reviewing
#    *any* of them carefully -- and an ignored dependency PR is worse
#    than a batched one. One PR per ecosystem per month is a review you
#    actually do.
#
# Grouping covers minor + patch only. A **major** bump still opens its
# own PR, because a major is the one that genuinely needs reading --
# TypeScript 7 is the standing proof: it passed build, tsc and tests,
# then broke `cap sync android` on the next release tag. (Since fixed
# upstream and now unblocked, but the lesson stands.)
#
# Security advisories are NOT affected by any of this: Dependabot's
# security updates are a separate mechanism and still open immediately,
# off-schedule, which is what docs/roadmap.md promises ("a security advisory
# with a real fix ships immediately instead").
#
# Standing reminder for whoever reviews these: CI runs tsc + build +
# vitest, but NOT `npx cap sync android`. Any bump touching build
# tooling (TypeScript, Vite, Capacitor, Tauri) needs that run by hand --
# a green checkmark is not sufficient evidence. See docs/maintenance.md's
# "Packaging paths" blind spot for the incident behind that rule.

updates:
  - package-ecosystem: "npm"
    directory: "/offlog-app"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # TypeScript 7 is already in use, as @typescript/native -- that alias
    # is what svelte-check --tsgo runs and it is NOT ignored here. The
    # plain `typescript` entry is 6.x only to satisfy svelte-check's peer
    # range (^5 || ^6); raising it to 7 breaks resolution and leaves
    # svelte-check loading an API version it does not support. Lift this
    # ignore when svelte-check widens that range, not before.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Any Capacitor or TypeScript bump must be verified by diffing the
    # generated capacitor.config.json against capacitor.config.ts, not
    # just by green gates -- see docs/decisions.md.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/offlog-desktop/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # These three share RustCrypto's `digest`/`crypto-common` trait
      # generation and are all consumed by pairing.rs, so they can only
      # move together. `pbkdf2_hmac::<Sha256>` is the hard case: pbkdf2
      # takes sha2's type as a generic parameter, so bumping either alone
      # is a guaranteed type mismatch, not a risk -- Dependabot opened
      # pbkdf2 0.13 and sha2 0.11 as two separate PRs and both failed to
      # compile, exactly as they had to.
      #
      # This group must name "major" explicitly. They are 0.x crates, and
      # a 0.x minor bump is a breaking change under Cargo's semver rules,
      # so Dependabot classifies 0.12 -> 0.13 as major -- which is what
      # let them escape cargo-minor-and-patch below and arrive one per PR.
      #
      # base64 is deliberately NOT here: pairing.rs uses it for the wire
      # encoding, but it shares no traits with the three above, so adding
      # it would widen the blast radius of a single PR for no safety gain.
      rustcrypto:
        patterns:
          - "pbkdf2"
          - "sha2"
          - "aes-gcm"
        update-types:
          - "major"
          - "minor"
          - "patch"
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
