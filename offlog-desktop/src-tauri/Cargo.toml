[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Owner-reported, 2026-07-31: Task Manager's Startup apps list showed the
# tray-resident process as "app.exe" -- Cargo names the binary after
# [package] name by default (no [[bin]] section previously existed), and
# `name = "app"` above predates this project's own rebrand. Explicit
# override to the real product name; [package]/[lib] names stay as-is
# since renaming those would touch the crate's own internal references
# (app_lib is used throughout lib.rs's own module system) for no benefit --
# only the binary Windows actually shows a user needed to change.
[[bin]]
name = "Offlog"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
rand = "0.10"
ureq = "3"
mdns-sd = "0.21"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
win32job = "2"
tauri-winrt-notification = "0.8"
# DPAPI bindings (CryptProtectData/CryptUnprotectData) for encrypting
# the stored sync password at rest -- ties the ciphertext to the
# current Windows user account, transparent, no prompt. Official
# Microsoft-maintained crate; narrower than pulling in a whole
# cross-platform keyring abstraction for a single OS-specific need.
# Pinned to match the version tauri-winrt-notification already pulls in
# (confirmed via `cargo tree -i windows-core`) -- avoids a third
# windows-core version in the dependency graph and the resulting
# cross-version type-mismatch errors that causes.
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
