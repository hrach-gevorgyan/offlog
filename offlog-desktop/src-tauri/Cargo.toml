[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The [[bin]] name below is what users see: without it Cargo names the
# binary after [package] name, and Task Manager's Startup apps list shows
# the tray-resident process as "app.exe". Explicit override to the real
# product name; [package]/[lib] names stay as-is
# since renaming those would touch the crate's own internal references
# (app_lib is used throughout lib.rs's own module system) for no benefit --
# only the binary Windows actually shows a user needed to change.
[[bin]]
name = "Offlog"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
rand = "0.10"
ureq = "3"
mdns-sd = "0.21"
tiny_http = "0.12"
# Pairing-handshake hardening (pairing.rs): the 6-digit code is now used
# to authenticate and encrypt the /pair exchange instead of travelling
# (and unlocking the credential response) in plain HTTP -- see that
# module's own comment for the full threat model.
pbkdf2 = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
win32job = "2"
tauri-winrt-notification = "0.8"
# DPAPI bindings (CryptProtectData/CryptUnprotectData) for encrypting
# the stored sync password at rest -- ties the ciphertext to the
# current Windows user account, transparent, no prompt. Official
# Microsoft-maintained crate; narrower than pulling in a whole
# cross-platform keyring abstraction for a single OS-specific need.
# tauri-winrt-notification pulls in its own older windows-core (confirmed
# via `cargo tree -i windows-core`); this crate's Win32 calls don't share
# its types, so a second windows-core version coexisting here is expected,
# not a drift to chase down.
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation", "UI_Notifications"] }
