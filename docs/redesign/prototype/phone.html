    --accent:#818cf8; --on-accent:#181a20; --late-bg:#3a1620; --late:#fb7185; --hi:#f87171; --mid:#fbbf24; --lo:#4ade80;
    --tab:#1c1f27; --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6);
    --s0:#60a5fa; --s1:#fbbf24; --s2:#f472b6; --s3:#a78bfa;
    --tg0:#1e3a5f; --ti0:#93c5fd; --tg1:#14391f; --ti1:#86efac; --tg2:#3a2e10; --ti2:#fbbf24; --tg3:#4a1d33; --ti3:#f9a8d4; --tg4:#2e1f5e; --ti4:#c4b5fd;
    --hero:#35388f; --on-hero:#eef0ff;
    --desk:#0d0f14; color-scheme:dark;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:'Hanken Grotesk',system-ui,sans-serif; background:var(--desk); color:var(--text); -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  input, textarea { font:inherit; color:inherit; }
  svg.i { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

  /* The phone: full screen on a phone, a framed 390x844 phone on a computer. */
  .phone { position:relative; width:100vw; height:100dvh; background:var(--bg); overflow:hidden; display:flex; flex-direction:column; }
  @media (min-width: 600px) {
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .phone { width:390px; height:min(844px, 96vh); border-radius:46px; border:9px solid #0b0b0d; box-shadow:0 20px 60px rgba(0,0,0,.25); }
    .phone .statusbar { display:flex; }
    .phone .statusbar.onhero { background:color-mix(in srgb, var(--bg) calc(var(--t, 0) * 100%), var(--hero)); color:color-mix(in srgb, var(--text) calc(var(--t, 0) * 100%), var(--on-hero)); }
  }
  .statusbar { display:none; height:44px; flex-shrink:0; justify-content:space-between; align-items:flex-end; padding:0 28px 6px; font-size:13px; font-weight:600; }
  .screens { position:relative; flex:1; min-height:0; }
  .screen { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; padding:0 16px 24px; background:var(--bg); scrollbar-width:none; }
  .screen::-webkit-scrollbar { display:none; }
  .screen.push { animation:pushIn .28s cubic-bezier(.2,0,0,1); }
  @keyframes pushIn { from { transform:translateX(100%); } to { transform:none; } }
  /* Back: the previous screen returns from the left (shared axis, reversed). */
  .screen.pop { animation:popIn .26s cubic-bezier(.2,0,0,1); }
  @keyframes popIn { from { transform:translateX(-24%); opacity:.4; } to { transform:none; opacity:1; } }
  /* Switching tabs: a quick fade through. */
  .screen.fade { animation:fadeThrough .21s cubic-bezier(.2,0,0,1); }
  @keyframes fadeThrough { from { opacity:0; transform:scale(.98); } to { opacity:1; transform:none; } }
  /* The navigation pill grows out from its centre when a tab becomes active. */
  .tabbar .tb span.pillnav { position:relative; }
  .tabbar .tb.on.grow span.pillnav { animation:pillIn .22s cubic-bezier(.2,0,0,1); }
  @keyframes pillIn { from { background-size:0 100%; clip-path:inset(0 50% 0 50% round 16px); } to { clip-path:inset(0 0 0 0 round 16px); } }
  @media (prefers-reduced-motion: reduce) { .screen.push, .screen.pop, .screen.fade, .sheet, .toast, .tabbar .tb.on.grow span.pillnav { animation:none !important; } }

  /* headers */
  .navbar { display:flex; align-items:center; justify-content:space-between; min-height:44px; padding-top:6px; }
  .back { display:flex; align-items:center; gap:2px; color:var(--accent); font-size:16px; font-weight:500; margin-left:-6px; padding:6px 4px; }
  .back svg.i { width:24px; height:24px; }
  .navacts { display:flex; gap:8px; }
  .ibtn { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--muted); background:var(--surface); box-shadow:var(--shadow); }
  .ltitle { font-size:31px; font-weight:700; letter-spacing:-.02em; margin:4px 2px 2px; line-height:1.15; }
  .lsub { font-size:13.5px; color:var(--faint); margin:0 2px 14px; display:flex; align-items:center; gap:6px; }
  .toprow { display:flex; align-items:center; justify-content:space-between; padding-top:10px; }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; display:inline-block; }

  /* Home */
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:4px 0 18px; }
  .tile { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:12px; display:flex; flex-direction:column; gap:10px; text-align:left; }
  .tile:active { transform:scale(.98); }
  .tile .top { display:flex; justify-content:space-between; align-items:center; }
  .tile .ic { display:flex; align-items:center; justify-content:center; color:var(--faint); background:none !important; }
  .tile .ic svg.i { width:20px; height:20px; }
  .tile b.late { color:var(--late); }
  .tile b { font-size:25px; font-weight:700; }
  .tile span.l { font-size:14.5px; font-weight:600; color:var(--muted); }
  .sec { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin:16px 4px 8px; display:flex; gap:8px; align-items:center; }
  .sec .n { background:var(--col); color:var(--muted); border-radius:999px; padding:0 7px; font-size:11px; letter-spacing:0; }
  .sec.late { color:var(--late); }
  .group { background:var(--surface); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; margin-bottom:14px; }
  .row { width:100%; display:flex; align-items:center; gap:12px; padding:12px 14px; font-size:15.5px; min-height:48px; text-align:left; }
  .row + .row { border-top:1px solid var(--border); }
  .row:active { background:var(--col); }
  .row .k { display:flex; align-items:center; gap:12px; color:var(--text); min-width:0; }
  .row .k .lbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .v { margin-left:auto; display:flex; align-items:center; gap:6px; color:var(--faint); font-size:15px; white-space:nowrap; }
  .row .v.set { color:var(--text); font-weight:500; }
  .row .chev { color:var(--faint); } .row .chev svg.i { width:16px; height:16px; }
  /* Icons are plain and grey: colour is kept for meaning (late, done, the one accent). */
  .ico { width:22px; height:22px; display:flex; align-items:center; justify-content:center; color:var(--faint); flex-shrink:0; background:none !important; }
  .ico svg.i { width:19px; height:19px; }

  /* main's task card */
  .card { width:100%; background:var(--surface); border-radius:12px; box-shadow:var(--shadow); padding:12px 12px 12px 14px; margin-bottom:8px; display:flex; gap:12px; align-items:center; position:relative; overflow:hidden; text-align:left; }
  .card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--p); }
  .card:active { transform:scale(.99); }
  .card .g { flex:1; min-width:0; }
  .card .t { font-size:15.5px; font-weight:600; line-height:1.3; }
  .card .s { font-size:12.5px; color:var(--faint); margin-top:3px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .card.done .t { color:var(--faint); text-decoration:line-through; }
  .card.done { opacity:.75; }
  .card.stack { align-items:flex-start; }
  .card.stack .chk { margin-top:1px; }
  .chk { width:22px; height:22px; border-radius:50%; border:2px solid color-mix(in srgb, var(--faint) 60%, transparent); flex-shrink:0; position:relative; }
  .chk::before { content:''; position:absolute; inset:-11px; }
  .chk.on { background:var(--accent); border-color:var(--accent); }
  .chk.on::after { content:''; position:absolute; left:6px; top:2.5px; width:5px; height:10px; border:solid var(--on-accent); border-width:0 2px 2px 0; transform:rotate(45deg); }
  .pill { font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; background:var(--col); color:var(--muted); white-space:nowrap; }
  .pill.today { background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); }
  .pill.late { background:var(--late-bg); color:var(--late); }
  .tag { font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .meta2 { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:7px; }
  .prog { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--faint); }
  .prog i { width:34px; height:4px; border-radius:2px; background:var(--col); display:block; overflow:hidden; } .prog i b { display:block; height:100%; background:var(--lo); }
  .ic-sm svg.i { width:13px; height:13px; }
  .empty { text-align:center; color:var(--faint); padding:28px 0; font-size:14.5px; }

  /* focus card */
  .focus { width:100%; background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:12px 14px; margin-bottom:6px; text-align:left; display:block; }
  .focus .h { display:flex; justify-content:space-between; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  .focus .h b { color:var(--accent); letter-spacing:0; text-transform:none; font-size:13px; }
  .focus .bar { display:flex; gap:5px; margin:9px 0 2px; } .focus .bar i { flex:1; height:5px; border-radius:3px; background:var(--col); } .focus .bar i.on { background:var(--accent); }
  .focus p { margin:8px 0 0; font-size:14px; color:var(--muted); }

  /* project: status pills */
  .pills { display:flex; gap:6px; margin:0 -16px 12px; padding:0 16px; overflow-x:auto; scrollbar-width:none; }
  .pills::-webkit-scrollbar { display:none; }
  .pills button { flex-shrink:0; display:flex; align-items:center; gap:6px; padding:8px 13px; border-radius:999px; font-size:14px; font-weight:600; background:var(--surface); box-shadow:var(--shadow); color:var(--muted); }
  .pills button.on { background:var(--accent); color:var(--on-accent); box-shadow:none; }
  .pills button i { font-style:normal; font-size:12px; opacity:.75; }
  .pdots { display:flex; justify-content:center; gap:6px; margin:10px 0 0; } .pdots i { width:6px; height:6px; border-radius:50%; background:var(--border); } .pdots i.on { background:var(--accent); width:16px; border-radius:3px; }

  /* task screen */
  .crumb { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--faint); margin:4px 2px 8px; }
  .ttl { display:flex; gap:12px; align-items:flex-start; margin:0 2px 16px; }
  .ttl .chk { width:26px; height:26px; margin-top:4px; } .ttl .chk.on::after { left:7.5px; top:3.5px; width:6px; height:11px; }
  .ttl textarea { flex:1; border:0; background:none; outline:none; resize:none; font-size:24px; font-weight:700; letter-spacing:-.015em; line-height:1.22; padding:0; overflow:hidden; }
  .note { width:100%; background:var(--surface); border:0; border-radius:14px; box-shadow:var(--shadow); padding:12px 14px; font-size:15px; min-height:84px; resize:none; outline:none; margin-bottom:14px; line-height:1.5; }
  .step { width:100%; display:flex; gap:12px; align-items:center; padding:12px 14px; font-size:15.5px; text-align:left; }
  .step + .step { border-top:1px solid var(--border); }
  .step .chk { width:20px; height:20px; } .step .chk.on::after { left:5px; top:1.5px; width:4.5px; height:9px; }
  .step.done .lbl { color:var(--faint); text-decoration:line-through; }
  .addstep { width:100%; border:0; background:none; outline:none; font-size:15.5px; padding:12px 14px 12px 46px; border-top:1px solid var(--border); }

  /* tab bar */
  .tabbar { flex-shrink:0; background:var(--tab); border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:flex-start; padding:8px 4px calc(10px + env(safe-area-inset-bottom)); }
  .tabbar .tb { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; font-weight:600; color:var(--faint); width:64px; padding-top:2px; }
  .tabbar .tb.on { color:var(--accent); }
  .tabbar .tb svg.i { width:23px; height:23px; }
  .tabbar .plus { width:52px; height:52px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; margin-top:-6px; box-shadow:0 4px 12px color-mix(in srgb, var(--accent) 45%, transparent); }
  .tabbar .plus svg.i { width:26px; height:26px; stroke-width:2.2; }
  .tabbar .plus:active { transform:scale(.94); }

  /* sheets */
  .scrim { position:absolute; inset:0; background:var(--scrim); z-index:20; animation:fade .2s; }
  @keyframes fade { from { opacity:0; } }
  .sheet { position:absolute; left:0; right:0; bottom:0; z-index:21; background:var(--bg); border-radius:22px 22px 0 0; box-shadow:0 -10px 30px rgba(0,0,0,.2); padding:8px 16px calc(16px + env(safe-area-inset-bottom)); animation:sheetUp .26s cubic-bezier(.05,.7,.1,1); max-height:85%; overflow-y:auto; }
  @keyframes sheetUp { from { transform:translateY(100%); } }
  .grab { width:40px; height:5px; border-radius:3px; background:var(--border); margin:0 auto 12px; }
  .sheet h3 { margin:2px 4px 12px; font-size:17px; font-weight:700; }
  .opt { width:100%; display:flex; align-items:center; gap:12px; padding:13px 14px; font-size:16px; text-align:left; }
  .opt + .opt { border-top:1px solid var(--border); }
  .opt .tick { margin-left:auto; color:var(--accent); }
  .opt.danger { color:var(--late); }

  /* quick add */
  .qa-field { width:100%; border:0; outline:none; background:none; font-size:18px; padding:4px 4px 12px; }
  .chips { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding:2px 0 4px; }
  .chips::-webkit-scrollbar { display:none; }
  .chips > button { flex-shrink:0; display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; padding:7px 11px; border-radius:10px; background:var(--surface); box-shadow:var(--shadow); color:var(--muted); }
  .chips > button.on { background:color-mix(in srgb, var(--accent) 14%, var(--surface)); color:var(--accent); }
  .chips svg.i { width:16px; height:16px; }
  .qa-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; }
  .qa-foot span { font-size:13px; color:var(--faint); }
  .qa-add { width:42px; height:42px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .qa-add:disabled { opacity:.4; }

  /* search */
  .sfield { display:flex; align-items:center; gap:8px; background:var(--surface); box-shadow:var(--shadow); border-radius:12px; padding:10px 12px; margin:6px 0 10px; color:var(--faint); }
  .sfield input { flex:1; border:0; outline:none; background:none; font-size:16px; color:var(--text); }

  .toast { position:absolute; left:16px; right:16px; bottom:166px; z-index:30; background:var(--text); color:var(--bg); border-radius:12px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; font-size:14.5px; animation:sheetUp .2s; }
  .toast button { color:var(--accent); font-weight:700; filter:brightness(1.3); }
  .note-proto { font-size:12.5px; color:var(--faint); text-align:center; margin:18px 8px 0; line-height:1.5; }

  /* ===== Android conventions (Material 3), replacing the iPhone look ===== */
  /* Top app bar: a normal-size title, a plain back arrow with no text. */
  .navbar, .toprow { min-height:56px; padding-top:4px; }
  .back { font-size:0; gap:0; margin-left:-10px; width:44px; height:44px; justify-content:center; border-radius:50%; color:var(--text); }
  .back svg.i { width:24px; height:24px; }
  .back:active { background:var(--col); }
  .ltitle { font-size:24px; font-weight:600; letter-spacing:0; margin:0 2px 2px; }
  .lsub { font-size:14px; margin-bottom:16px; }
  .ibtn { background:none; box-shadow:none; color:var(--muted); width:44px; height:44px; }
  .ibtn:active { background:var(--col); }
  /* Lists: full width, leading icon, no › arrows, no rounded iPhone groups. */
  .group { background:none; box-shadow:none; border-radius:0; margin:0 -16px 8px; }
  .row { padding:14px 20px; min-height:56px; font-size:16px; }
  .row + .row { border-top:0; }
  .row .chev { display:none; }
  .row .k { gap:20px; }
  .ico svg.i { width:22px; height:22px; }
  .sec { text-transform:none; letter-spacing:0; font-size:14px; font-weight:600; color:var(--accent); margin:18px 4px 4px; }
  .sec.late { color:var(--late); }
  .sec .n { background:none; padding:0; color:var(--faint); font-size:13px; }
  .note { border-radius:12px; box-shadow:none; border:1px solid var(--border); background:var(--surface); }
  .step { padding:12px 20px; } .step + .step { border-top:0; }
  .addstep { border-top:0; padding-left:56px; }
  /* Home tiles: flat, outlined. */
  .tile { box-shadow:none; border:1px solid var(--border); border-radius:12px; }
  /* Cards stay main's, but flatter. */
  .card { box-shadow:none; border:1px solid var(--border); }
  .focus { box-shadow:none; border:1px solid var(--border); }
  /* Bottom navigation bar: the active tab sits in a soft pill; the + is a floating button. */
  .tabbar { justify-content:space-around; padding:10px 8px calc(14px + env(safe-area-inset-bottom)); border-top:0; background:var(--col); }
  .tabbar .tb { width:auto; min-width:64px; gap:4px; font-size:12px; color:var(--muted); }
  .tabbar .tb span.pillnav { display:flex; align-items:center; justify-content:center; width:60px; height:32px; border-radius:16px; }
  .tabbar .tb.on { color:var(--text); }
  .tabbar .tb.on span.pillnav { background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent); }
  .tabbar .tb svg.i { width:22px; height:22px; }
  .fab { position:absolute; right:16px; bottom:calc(92px + env(safe-area-inset-bottom)); z-index:10; width:56px; height:56px; border-radius:16px; background:color-mix(in srgb, var(--accent) 20%, var(--surface)); color:var(--accent); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(0,0,0,.18); }
  .fab svg.i { width:24px; height:24px; stroke-width:2.2; }
  .fab:active { transform:scale(.95); }
  .screen { padding-bottom:96px; }
  /* The title sits in the top bar: beside the back arrow on pushed screens, alone on a tab's first screen. */
  .navbar + .ltitle, .toprow + .ltitle { margin-top:-50px; line-height:44px; font-size:22px !important; margin-bottom:10px; padding-right:100px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .navbar + .ltitle { margin-left:40px; }
  .toprow + .ltitle { margin-left:2px; }
  .toprow .ltitle { font-size:22px; }
  /* ===== Offlog's own look, from main: cards, uppercase labels with count badges, a round indigo + ===== */
  .ltitle, .navbar + .ltitle, .toprow + .ltitle { font-weight:700 !important; letter-spacing:-.01em; }
  .toprow .ltitle { font-size:22px; }
  .sec { text-transform:uppercase; letter-spacing:.06em; font-size:12px; font-weight:700; color:var(--faint); margin:18px 4px 8px; }
  .sec .n { background:var(--col); color:var(--muted); border-radius:999px; padding:0 7px; font-size:11px; letter-spacing:0; }
  .group { background:var(--surface); box-shadow:var(--shadow); border-radius:14px; margin:0 0 14px; overflow:hidden; }
  .row { padding:13px 16px; min-height:52px; }
  .row + .row { border-top:1px solid var(--border); }
  .row .k { gap:14px; }
  .ico svg.i { width:20px; height:20px; }
  .step { padding:12px 16px; } .step + .step { border-top:1px solid var(--border); }
  .addstep { border-top:1px solid var(--border); padding-left:48px; }
  .card, .tile, .focus { border:0; box-shadow:var(--shadow); }
  .note { border:0; box-shadow:var(--shadow); border-radius:14px; }
  /* A project's open count is a badge, as on main's project cards. */
  [data-push^="project:"] .v { background:var(--col); color:var(--muted); border-radius:999px; padding:1px 9px; font-size:12.5px; font-weight:600; }
  /* The navigation bar sits on white, like main's panels. */
  .tabbar { background:var(--tab); border-top:1px solid var(--border); }
  /* main's round indigo + */
  .fab { border-radius:50%; background:var(--accent); color:var(--on-accent); box-shadow:0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent); }
  .sheet .group { margin:0 0 10px; }
  .opt { padding:14px 16px; } .opt + .opt { border-top:1px solid var(--border); }
  .hero { margin:-4px -16px 0; padding:8px 20px 56px; background:var(--hero); color:var(--on-hero); border-radius:0 0 28px 28px; }
  .tiles.row3 { grid-template-columns:repeat(3, 1fr); }
  .tiles.row3 .tile { padding:10px 12px; gap:6px; }
  .tiles.row3 .tile b { font-size:20px; }
  .tiles.row3 .tile span.l { font-size:13px; }
  /* Tiles rise in once, a beat apart. */
  .tiles.rise .tile { animation:rise .5s cubic-bezier(.05,.7,.1,1) backwards; }
  .tiles.rise .tile:nth-child(2) { animation-delay:.06s; } .tiles.rise .tile:nth-child(3) { animation-delay:.12s; }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } }
  @media (prefers-reduced-motion: reduce) {
    .tiles.rise .tile { animation:none; }
  }
  /* ===== Home hero: diagonal edge, the Offlog mark as a muted watermark ===== */
  .hero.mark { position:relative; overflow:hidden; border-radius:0; margin:-4px -16px 0; padding:8px 20px 84px;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 64px), 0 100%); }
  .hero.mark .hbody { position:relative; z-index:1; }
  .hero.mark .wm { position:absolute; z-index:0; right:-86px; top:-58px; width:300px; height:300px; color:var(--on-hero); opacity:.1; pointer-events:none;
    animation:wmIn 1.2s cubic-bezier(.05,.7,.1,1) backwards; }
  @keyframes wmIn { from { opacity:0; transform:translate(24px, -16px) rotate(8deg); } }
  .hero.mark .hbody { display:block; width:100%; text-align:left; color:inherit; margin-top:10px; }
  .hero.mark .hi { font-size:15px; opacity:.9; margin:0 0 10px; font-weight:500; }
  .hero.mark .hi span { opacity:.75; font-weight:400; }
  .hero.mark .count { display:flex; align-items:baseline; gap:10px; }
  .hero.mark .count b { font-size:56px; font-weight:800; letter-spacing:-.04em; line-height:.9; }
  .hero.mark .count span { font-size:18px; font-weight:600; }
  .hero.mark .meta { font-size:14px; opacity:.9; margin:10px 0 12px; }
  .hero.mark .meta .l { font-weight:700; opacity:1; }
  .track { display:flex; gap:5px; max-width:260px; }
  .track i { flex:1; height:6px; border-radius:3px; background:color-mix(in srgb, var(--on-hero) 24%, transparent); transition:background .45s; }
  .track i.on { background:var(--on-hero); }
  .track i.pop { animation:dash .55s cubic-bezier(.2,0,0,1) backwards; }
  @keyframes dash { from { background:color-mix(in srgb, var(--on-hero) 24%, transparent); transform:scaleY(.4); } }
  .tiles.lift2 { margin-top:-54px; position:relative; z-index:2; }
  /* ===== The top bar over Home: indigo over the hero, the regular white bar after it =====
     --t (0..1) follows the scroll across the hero's last 40px, eased, so the change moves with the finger:
     stop halfway and it stays halfway. Nothing here is timed. */
  .hero.mark { padding-top:64px; }
  .appbar { position:absolute; top:0; left:0; right:0; z-index:6; height:60px; display:flex; align-items:center; gap:12px; padding:0 8px 0 20px;
    --t:0; background:color-mix(in srgb, var(--bg) calc(var(--t) * 100%), var(--hero));
    color:color-mix(in srgb, var(--text) calc(var(--t) * 100%), var(--on-hero));
    box-shadow:0 1px 0 color-mix(in srgb, var(--border) calc(var(--t) * 100%), transparent), 0 4px 12px rgba(16,24,40,calc(var(--t) * .06)); }
  .appbar .t { display:flex; flex-direction:column; justify-content:center; min-width:0; }
  .appbar .t b { font-size:22px; font-weight:700; letter-spacing:-.01em; line-height:1.1; display:grid; }
  /* Two copies of the title on one spot: white fades out while dark fades in (no grey middle). */
  .appbar .t b span { grid-area:1 / 1; }
  .appbar .t b .on-hero { color:var(--on-hero); opacity:calc(1 - var(--t)); }
  .appbar .t b .on-page { color:var(--text); opacity:var(--t); }
  .appbar .t small { font-size:12.5px; font-weight:600; color:var(--faint); overflow:hidden;
    height:calc(var(--t) * 16px); opacity:clamp(0, calc(var(--t) * 2 - 1), 1); }
  .appbar .ibtn { margin-left:auto; color:inherit; }
  /* The muted mark lives above the bar, so the bar can never cut it. */
  .wm-layer { position:absolute; top:0; right:0; width:300px; height:300px; z-index:7; pointer-events:none; overflow:visible; }
  .wm-layer svg { position:absolute; right:-86px; top:-58px; width:300px; height:300px; color:var(--on-hero); opacity:.1; animation:wmIn 1.2s cubic-bezier(.05,.7,.1,1) backwards; }
  @media (prefers-reduced-motion: reduce) { .wm-layer svg { animation:none; } }
  @media (prefers-reduced-motion: reduce) { .hero.mark .wm, .track i.pop { animation:none; } .track i { transition:none; } }
  /* Sheets: Android bottom sheets with a drag handle; options full width. */
  .sheet .group { margin:0 -16px 8px; }
  .opt { padding:14px 20px; } .opt + .opt { border-top:0; }
  /* ===== Parity: the rest of main's features, in the same language ===== */
  /* Segmented control (Agenda List/Month, Organize tabs, Board/List). */
  .segc { display:flex; background:var(--col); border-radius:12px; padding:3px; gap:2px; margin:0 0 14px; }
  .segc button { flex:1; padding:7px 0; border-radius:9px; font-size:14px; font-weight:600; color:var(--muted); }
  .segc button.on { background:var(--surface); color:var(--text); box-shadow:var(--shadow); }
  /* A switch at the end of a settings row. */
  .sw { margin-left:auto; width:42px; height:26px; border-radius:13px; background:var(--border); position:relative; flex-shrink:0; transition:background .15s; }
  .sw::after { content:''; position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .18s cubic-bezier(.2,0,0,1); }
  .sw.on { background:var(--accent); } .sw.on::after { transform:translateX(16px); }
  .row .sub { display:block; font-size:13px; color:var(--faint); margin-top:1px; white-space:normal; }
  .row .k.col { flex-direction:column; align-items:flex-start; gap:0; }
  .row.acc .k { color:var(--accent); font-weight:600; }
  .row.danger .k { color:var(--late); }
  .row input.inl { margin-left:auto; border:0; outline:none; background:none; text-align:right; font-size:15px; color:var(--text); min-width:0; width:55%; }
  .row input[type=time].inl { width:auto; color:var(--accent); }
  .tbtn { color:var(--accent); font-weight:600; font-size:15px; padding:8px 10px; border-radius:10px; }
  .tbtn:active { background:var(--col); }
  .tbtn.danger { color:var(--late); }
  /* Agenda month. */
  .mhead { display:flex; align-items:center; justify-content:space-between; margin:0 0 6px 4px; font-weight:700; font-size:16px; }
  .mhead span { display:flex; }
  .month { display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:8px 6px; margin-bottom:6px; }
  .month .wd { font-size:11px; font-weight:700; color:var(--faint); text-align:center; padding:2px 0 4px; }
  .month button { height:42px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border-radius:10px; font-size:14px; font-weight:500; font-variant-numeric:tabular-nums; }
  .month button:active { background:var(--col); }
  .month button.out { color:var(--faint); opacity:.45; }
  .month button.today { color:var(--accent); font-weight:700; }
  .month button.sel { background:var(--accent); color:var(--on-accent); }
  .month button i { width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:.7; }
  .month button i.late { background:var(--late); opacity:1; }
  .month button i.none { background:none; }
  .month button.sel i { background:var(--on-accent); }
  /* Project list view: dense rows, select mode, a floating bulk bar. */
  .lrows { background:var(--surface); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .lrow { width:100%; display:flex; align-items:center; gap:12px; padding:11px 14px; text-align:left; font-size:15px; }
  .lrow + .lrow { border-top:1px solid var(--border); }
  .lrow:active { background:var(--col); }
  .lrow .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  .lrow.done .t { color:var(--faint); text-decoration:line-through; }
  .lrow .st { font-size:12px; color:var(--faint); white-space:nowrap; }
  .lrow .box { width:22px; height:22px; border-radius:7px; border:2px solid color-mix(in srgb, var(--faint) 60%, transparent); flex-shrink:0; position:relative; }
  .lrow.picked { background:color-mix(in srgb, var(--accent) 9%, var(--surface)); }
  .lrow.picked .box { background:var(--accent); border-color:var(--accent); }
  .lrow.picked .box::after { content:''; position:absolute; left:5.5px; top:1.5px; width:5px; height:10px; border:solid var(--on-accent); border-width:0 2px 2px 0; transform:rotate(45deg); }
  .lrow .pr { width:3px; align-self:stretch; border-radius:2px; background:var(--p); margin:-4px -6px -4px -8px; }
  .bulkbar { position:absolute; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:11; background:var(--text); color:var(--bg); border-radius:16px; display:flex; align-items:center; gap:2px; padding:6px 6px 6px 16px; box-shadow:0 8px 24px rgba(0,0,0,.25); animation:sheetUp .22s cubic-bezier(.2,0,0,1); }
  .bulkbar b { font-size:14px; margin-right:auto; white-space:nowrap; }
  .bulkbar button { padding:9px 9px; border-radius:10px; font-size:13.5px; font-weight:600; }
  .bulkbar button:active { background:color-mix(in srgb, var(--bg) 16%, transparent); }
  .fbar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:-4px 0 12px; }
  .fbar .pill { background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); }
  .ibtn.on { color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); }
  /* Chip pickers inside sheets. */
  .cpick { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 14px; }
  .cpick button { font-size:13.5px; font-weight:600; padding:7px 12px; border-radius:10px; background:var(--surface); box-shadow:var(--shadow); color:var(--muted); display:flex; align-items:center; gap:6px; }
  .cpick button.on { background:color-mix(in srgb, var(--accent) 14%, var(--surface)); color:var(--accent); }
  .sheet .lab { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin:4px 4px 8px; }
  .sheet .fld { width:100%; border:0; outline:none; background:var(--surface); box-shadow:var(--shadow); border-radius:12px; padding:12px 14px; font-size:16px; margin:0 0 14px; }
  .sheet .go { width:100%; background:var(--accent); color:var(--on-accent); border-radius:12px; padding:13px; font-size:16px; font-weight:700; margin-top:4px; }
  .sheet .go:disabled { opacity:.4; }
  .sheet .warn { font-size:13px; color:var(--late); margin:-8px 4px 12px; }
  .sheet p.say { font-size:14.5px; color:var(--muted); margin:0 4px 14px; line-height:1.5; }
  .sw8 { display:flex; gap:10px; margin:0 0 14px 4px; } .sw8 button { width:30px; height:30px; border-radius:50%; } .sw8 button.on { box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
  /* Card markers and the task's extra blocks. */
  .mk { display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:600; }
  .mk.blk { color:var(--late); }
  .qa-warn { font-size:12.5px; color:var(--late); margin:8px 4px 0; }
  .md { background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:12px 14px; font-size:15px; line-height:1.55; margin-bottom:14px; min-height:84px; }
  .md h4 { margin:0 0 4px; font-size:16px; } .md ul { margin:4px 0; padding-left:20px; } .md p { margin:0 0 6px; }
  .notehead { display:flex; justify-content:space-between; align-items:center; margin:0 4px 6px; }
  .notehead .sec { margin:0; }
  .step { padding:0 6px 0 0; } .step > button:first-child { flex:1; display:flex; gap:12px; align-items:center; padding:12px 0 12px 16px; text-align:left; font-size:15.5px; min-width:0; }
  .step .x { width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--faint); border-radius:50%; flex-shrink:0; }
  .step .x svg.i { width:16px; height:16px; }
  .step .x:active { background:var(--col); }
  .file { display:flex; align-items:center; gap:12px; padding:10px 16px; }
  .file .th { width:40px; height:40px; border-radius:8px; background:var(--col); display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:10px; font-weight:700; flex-shrink:0; }
  .file + .file { border-top:1px solid var(--border); }
  .hstat { font-size:13px; color:var(--faint); text-align:center; margin:4px 0 0; }
  .late-n { color:var(--late); font-size:12.5px; font-weight:600; }
  .day { font-size:13px; color:var(--faint); font-weight:600; margin:14px 4px 6px; }
  .src { font-size:11px; font-weight:700; color:var(--faint); background:var(--col); border-radius:6px; padding:1px 6px; }
  .mhint { font-size:12px; color:var(--accent); font-weight:600; }
  .pcode { font-size:40px; font-weight:800; letter-spacing:.12em; text-align:center; margin:6px 0 4px; font-variant-numeric:tabular-nums; }
  /* Conflict versions side by side. */
  .ver { background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:12px 14px; margin-bottom:10px; }
  .ver small { color:var(--faint); font-size:12.5px; display:block; margin-bottom:4px; }
  .ver button { color:var(--accent); font-weight:700; font-size:14px; margin-top:8px; }
  /* App lock screen. */
  .lock { position:absolute; inset:0; z-index:40; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; animation:fade .2s; }
  .lock svg.logo { width:52px; height:52px; color:var(--accent); }
  .lock .who { font-size:18px; font-weight:700; } .lock .hint { font-size:13px; color:var(--faint); margin-top:-12px; }
  .lock .dots { display:flex; gap:14px; } .lock .dots i { width:13px; height:13px; border-radius:50%; border:2px solid var(--faint); } .lock .dots i.on { background:var(--accent); border-color:var(--accent); }
  .pad { display:grid; grid-template-columns:repeat(3, 70px); gap:14px; }
  .pad button { height:70px; border-radius:50%; font-size:26px; font-weight:500; background:var(--surface); box-shadow:var(--shadow); }
  .pad button:active { background:var(--col); }
  .pad button.nob { background:none; box-shadow:none; font-size:14px; color:var(--accent); font-weight:600; }
  .lock .foot { font-size:14px; color:var(--accent); font-weight:600; }
  /* Three actions in the top bar need more room beside the title. */
  .navbar:has(.navacts > :nth-child(3)) + .ltitle { padding-right:150px; }
  /* Press feedback on everything tappable in lists. */
  .lrow, .row, .opt, .month button { transition:background .12s; }
  .opt:active { background:var(--col); }
  @media (prefers-reduced-motion: reduce) { .sw, .sw::after, .bulkbar { transition:none; animation:none; } }
</style>

const prioColor = t => t.priority === 3 ? 'var(--hi)' : 'transparent';

const openBlocker = t => t.blockedBy.some(id => { const b = tasks.find(x => x.id === id); return b && !isDone(b); });

    ${pillEl(t)}</div>`;

// A card inside a project: date, tags and steps as chips under the title.
function pcard(t) {

const SET_SCREENS = ['settings', 'appearance', 'trash', 'history', 'notifications', 'sync', 'lock', 'organize', 'archived', 'backup', 'advanced', 'statuses', 'thist'];

function applyFilter(arr, fl) {

}

const SCREENS = {

    const pct = todayAll.length ? Math.round(doneToday / todayAll.length * 100) : 0;

    const dashes = Array.from({ length: n }, (_, i) => `<i class="${i < d ? 'on' : ''} ${i < d && i >= prev ? 'pop' : ''}" style="animation-delay:${(i - prev) * .08}s"></i>`).join('');

          <div class="hi">${greet}, Hrach <span>· ${WD[D0(TODAY).getDay()]} ${D0(TODAY).getDate()} ${MO[D0(TODAY).getMonth()]}</span></div>
          <div class="count"><b>${todayN}</b><span>left today</span></div>

    return top + spaces.map(s => `<div class="sec">${esc(s.name)}</div><div class="group">${projects.filter(p => p.space === s.id).sort((a, b) => a.position - b.position).map(p => `<button class="row" data-push="project:${p.id}"><span class="k"><span class="dot" style="background:${sc(s.id)}"></span><span class="lbl">${esc(p.name)}</span></span>${(n => n ? `<span class="late-n">${n} late</span>` : '')(tasks.filter(t => t.project === p.id && isLate(t)).length)}<span class="v" style="margin-left:${tasks.some(t => t.project === p.id && isLate(t)) ? '8px' : 'auto'}">${tasks.filter(t => t.project === p.id && live(t) && !isDone(t)).length}</span><span class="chev">${I.chev}</span></button>`).join('')}<button class="row acc" data-sheet="newproj" data-space="${s.id}"><span class="k"><span class="ico" style="color:var(--accent)">${I.plus}</span>New project</span></button></div>`).join('') + weekLine();

const TITLES = { home: 'Home', today: 'Today', agenda: 'Agenda', search: 'Search', late: 'Late', pinned: 'Pinned', focus: 'Focus', settings: 'Settings', appearance: 'Appearance', trash: 'Recycle bin', history: 'History', notifications: 'Notifications', sync: 'Sync & devices', lock: 'App lock', organize: 'Organize', archived: 'Archived projects', backup: 'Backup & restore', advanced: 'Advanced', statuses: 'Statuses', thist: 'Task history' };

// ------------------------------------------------------------ navigation: a stack per tab
const TABS = ['home', 'today', 'agenda', 'search'];
const st = { tab: 'home', stacks: { home: [{ k: 'home' }], today: [{ k: 'today' }], agenda: [{ k: 'agenda' }], search: [{ k: 'search' }] }, sheet: null, anim: false };
const stack = () => st.stacks[st.tab];
function titleOf(s) { if (s.k === 'project') return P(s.id).name; if (s.k === 'task') return 'Task'; return TITLES[s.k]; }
function push(k, extra = {}) { const s = { k, ...extra }; s.title = titleOf(s); stack().forEach(x => x.title = titleOf(x)); stack().push(s); st.anim = true; render(); }
function pop() { if (stack().length > 1) { stack().pop(); st.anim = 'pop'; render(); } }

// ------------------------------------------------------------ render
function render(keepScroll) {
  const el = document.getElementById('screens');
  const cur = stack().at(-1);
  const prev = el.querySelector('.screen');
  const y = keepScroll && prev ? prev.scrollTop : 0;
  stack().forEach(x => x.title = titleOf(x));
  el.innerHTML = `<div class="screen ${st.anim === true ? 'push' : st.anim || ''}">${SCREENS[cur.k](cur)}</div>`;
  el.querySelector('.screen').scrollTop = y;
  st.anim = false;
  document.getElementById('tabbar').innerHTML = TABS.map(t => t === 'plus'
    ? `<button class="plus" data-quick aria-label="Add a task">${I.plus}</button>`
    : `<button class="tb ${st.tab === t ? 'on' : ''} ${st.tab === t && st.grow ? 'grow' : ''}" data-tab="${t}"><span class="pillnav">${I[t === 'home' ? 'home' : t]}</span>${TITLES[t]}</button>`).join('') ;
  if (!document.querySelector('.fab')) { const b = document.createElement('button'); b.className = 'fab'; b.dataset.quick = ''; b.setAttribute('aria-label', 'Add a task'); b.innerHTML = I.plus; document.querySelector('.phone').append(b); }
  document.querySelector('.fab').style.display = st.sheet || SET_SCREENS.includes(cur.k) || cur.sel ? 'none' : '';
  document.querySelector('.phone').classList.toggle('contrast', pref.contrast);
  afterHome();
  const ta = document.getElementById('title'); if (ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
  renderSheet();
}

// Home: the regular top bar sits over the hero and turns white as the hero scrolls away.
function afterHome() {
  document.querySelectorAll('.minibar, .appbar, .wm-layer').forEach(x => x.remove());
  document.querySelector('.statusbar').classList.remove('onhero');
  const hero = document.querySelector('.screen .hero.mark');
  if (!hero) return;
  const scr = hero.closest('.screen');
  const b = hero.querySelector('.hbody').dataset;
  const bar = document.createElement('div');
  bar.className = 'appbar';
  bar.innerHTML = `<span class="t"><b><span class="on-hero">Offlog</span><span class="on-page" aria-hidden="true">Offlog</span></b><small>${b.left} left · ${b.done} of ${b.total} done</small></span>${settingsBtn}`;
  // Lift the mark out of the hero onto a layer above the bar.
  const inHero = hero.querySelector('.wm'); if (inHero) inHero.remove();
  const layer = document.createElement('div');
  layer.className = 'wm-layer';
  layer.innerHTML = '<svg aria-hidden="true"><use href="#offlog-mark"/></svg>';
  const screens = document.getElementById('screens');
  screens.append(bar, layer);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const H = () => hero.offsetHeight;
  let raf = 0;
  const apply = () => {
    raf = 0;

    // eased (smoothstep) so the muddy middle of an indigo-to-white mix passes quickly.
    const lin = Math.min(1, Math.max(0, (y - (end - span)) / span));
    const t = lin * lin * (3 - 2 * lin);
    bar.style.setProperty('--t', t.toFixed(3));
    const sb = document.querySelector('.statusbar'); sb.classList.add('onhero'); sb.style.setProperty('--t', t.toFixed(3));
    // The mark scrolls at 0.65x the page (reads as depth) and fades out as the bar turns white.
    const move = reduce ? y : y * .65;
    layer.style.transform = `translateY(${-move}px)`;
    layer.style.opacity = String(1 - t);
    layer.style.visibility = t >= 1 ? 'hidden' : 'visible';
  };
  scr.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(apply); }, { passive: true });
  apply();
}

// Quick add: a small version of main's parser (nlpParse.ts): dates, !priority, #tag, @project.
function parse(text) {
  let s = ' ' + text + ' ', dueD = null, pr = null, tagsP = [], proj = null;
  const cut = re => { const m = re.exec(s); if (m) s = s.replace(m[0], ' '); return m; };
  let m;
  if ((m = cut(/\s(today)(?!['’]s)\s/i))) dueD = TODAY;
  else if ((m = cut(/\s(tomorrow)(?!['’]s)\s/i))) dueD = add(TODAY, 1);
  else if ((m = cut(/\s(monday|tuesday|wednesday|thursday|friday|saturday|sunday)(?!['’]s)\s/i))) { const w = WL.findIndex(x => x.toLowerCase() === m[1].toLowerCase()); let n = (w - D0(TODAY).getDay() + 7) % 7 || 7; dueD = add(TODAY, n); }
  if ((m = cut(/\s!(high|h|urgent|p1|low|l|p3|normal|p2)\s/i))) pr = /^(high|h|urgent|p1)$/i.test(m[1]) ? 3 : /^(low|l|p3)$/i.test(m[1]) ? 1 : 2;
  while ((m = cut(/\s#([\w-]+)\s/))) tagsP.push(m[1].toLowerCase());
  if ((m = cut(/\s@([\w-]+)\s/))) proj = projects.find(p => p.name.toLowerCase().replace(/[^a-z0-9]/g, '').startsWith(m[1].toLowerCase().replace(/[^a-z0-9]/g, '')));
  return { title: s.replace(/\s+/g, ' ').trim(), due: dueD, priority: pr, tags: tagsP, project: proj };
}

let toastT;
function toast(text, undo) {
  let el = document.querySelector('.toast'); if (el) el.remove();
  el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<span>${esc(text)}</span>${undo ? '<button>Undo</button>' : ''}`;
  if (undo) el.querySelector('button').onclick = () => { undo(); el.remove(); render(true); };
