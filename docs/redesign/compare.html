<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offlog — before and after</title>
<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#1a1918; color:#eceae4; }
  h1 { font-size:17px; font-weight:600; margin:0; padding:18px 28px; }
  section { padding:8px 28px 28px; }
  h2 { font-size:14px; font-weight:600; margin:0 0 10px; color:#b5afa5; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  figure { margin:0; } figcaption { font-size:12.5px; color:#8f897f; margin:6px 0 0; }
  img { width:100%; border-radius:8px; display:block; }
</style></head><body>
<h1>Before (main) and after (prototype), same data, same size</h1>
<section><h2>Home</h2><div class="pair">
  <figure><img src="before/dashboard-dark.jpg" alt=""><figcaption>main: Dashboard, a grid of project cards</figcaption></figure>
  <figure><img src="after/today-dark.jpg" alt=""><figcaption>prototype: Today, a list of what is due</figcaption></figure></div></section>
<section><h2>Board</h2><div class="pair">
  <figure><img src="before/board.jpg" alt=""><figcaption>main</figcaption></figure>
  <figure><img src="after/board-dark.jpg" alt=""><figcaption>prototype</figcaption></figure></div></section>
<section><h2>Opening a task</h2><div class="pair">
  <figure><img src="before/task-editor.jpg" alt=""><figcaption>main: a form in a popup</figcaption></figure>
  <figure><img src="after/task-dark.jpg" alt=""><figcaption>prototype: a pane beside the board</figcaption></figure></div></section>
</body></html>
