apply plugin: 'com.android.application'

// Real Play Store signing key, kept outside the repo entirely (see
// docs/roadmap.md's C3). Loaded from a gitignored
// keystore.properties file when present (see keystore.properties.example
// for the format) -- CI writes this file from repo secrets before the
// build; a real local release build would do the same by hand. Falls back
// to the debug keystore below when the file is absent, so Android
// Studio's Run button keeps working for local dev exactly as before on
// any machine that doesn't have the real key (which is every machine
// except the one it was generated on, deliberately).
def keystorePropsFile = rootProject.file('app/keystore.properties')
def keystoreProps = new Properties()
def hasRealKeystore = keystorePropsFile.exists()
if (hasRealKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "com.offlog.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.offlog.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 60800
        versionName "6.8.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasRealKeystore) {
            playstore {
                storeFile rootProject.file('app/' + keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        // The release type must always have SOME signingConfig: with
        // none, Android Studio's Run button produces an unsigned,
        // uninstallable build and reports it as "Activity class ... does
        // not exist", which reads like a manifest problem and isn't one.
        // Real playstore key when keystore.properties is present (CI
        // writes it from repo secrets), AGP's debug keystore otherwise.
        // No applicationId suffix either way, unlike debug below, so this
        // installs as com.offlog.app.
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig hasRealKeystore ? signingConfigs.playstore : signingConfigs.debug
        }
        // The .debug applicationId suffix is load-bearing: without it a
        // Studio test run shares storage with the real install on the
        // same device and overwrites live data. Desktop gates the same
        // way via `is_debug_build` (offlog-desktop's lib.rs).
        debug {
            applicationIdSuffix ".debug"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
